name: Release

# Production releases only, and only from master. Work reaches master by being
# merged dev -> master, so anything published here has already been through CI
# on a PR into dev and again on the promotion PR.
#
# Nightlies are a separate workflow publishing the `next` dist-tag; this one owns
# `latest`, so `npm install unified-obsidian-mcp` always resolves to production.
#
# The version bump itself is an ordinary change: bump it in a PR into dev, then
# promote dev -> master. This workflow only tags and publishes what is already on
# master, so it never has to write to a protected branch.
#
# Two ways in, both equivalent:
#
#  1. Push a tag — `npm version minor` on a dev PR, promote, then
#     `git tag v0.2.0 && git push origin v0.2.0`.
#  2. Run this workflow from the Actions tab — it tags master's current HEAD with
#     the version already in package.json and publishes that.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate, but do not publish or tag"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Reuse the exact CI gates rather than a weaker copy of them.
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    name: publish
    runs-on: ubuntu-latest
    needs: verify
    environment: release
    permissions:
      contents: write # create the tag and the GitHub Release
      id-token: write # npm provenance attestation
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the master-ancestry check below can resolve.
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.ref }}

      - name: Refuse to release anything that is not on master
        run: |
          git fetch origin master --depth=1
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::this commit is not on master; promote dev -> master first"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Fail early if the publish token is missing
        if: ${{ !inputs.dry_run }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. Add it under Settings → Secrets → Actions."
            exit 1
          fi

      - run: npm ci

      - name: Tag master at the version already in package.json
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already tagged. Bump the version in a PR into dev first."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            # A tag is not a branch push, so this works against protected master.
            git push origin "v$VERSION"
          else
            echo "dry run: not pushing v$VERSION"
          fi

      - name: Resolve and validate the release version
        id: resolve
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::tag $TAG does not match package.json version $VERSION"
              exit 1
            fi
          fi
          echo "Releasing v$VERSION"

      - name: Manifests agree with package.json
        run: node scripts/sync-version.mjs --check

      - name: Build
        run: npm run build

      - name: Degraded-mode smoke test on the build
        run: node scripts/ci-smoke.mjs

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # --provenance links the tarball to this workflow run; it needs id-token.
        # --tag latest is explicit: nightlies publish to `next`, and `latest` must
        # only ever point at a production release.
        run: npm publish --provenance --access public --tag latest

      - name: Pack for the release artifact
        id: pack
        run: |
          npm pack --json > pack.json
          echo "tarball=$(node -p "require('./pack.json')[0].filename")" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            --verify-tag \
            "${{ steps.pack.outputs.tarball }}"

  # Opt-in: set the repository variable PUBLISH_MCP_REGISTRY to "true" once the
  # server is claimed on the registry. Kept separate so a registry hiccup cannot
  # fail a release that already published to npm.
  mcp-registry:
    name: publish to MCP registry
    runs-on: ubuntu-latest
    needs: release
    if: ${{ vars.PUBLISH_MCP_REGISTRY == 'true' && !inputs.dry_run }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
