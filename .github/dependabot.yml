version: 2
updates:
  # The MCP SDK and @playwright/mcp are the two dependencies that actually move
  # the tool surface, so they are worth seeing promptly rather than in a monthly
  # batch. Everything else is grouped to keep the PR volume sane.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns:
          - "@modelcontextprotocol/sdk"
          - "@playwright/mcp"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
